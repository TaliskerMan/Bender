# Change Comment (2026-11-15, BEND-9 / BEND-10 & CP-AnalyzerAndSonarHygiene / CP-ChangeComments):
# Clean, secret-free SonarQube Cloud configuration matching `.sonarcloud.properties`
# with strictly disjoint `sonar.sources` (`.`) and `sonar.tests` (`tests`) scopes.
sonar.organization=taliskerman
sonar.projectKey=TaliskerMan_Bender
sonar.projectName=Bender
sonar.projectVersion=0.1.17
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=tests/**,Audit/**,artifacts/**,bin/**,debian/bender/**,.pybuild/**,data/**,preso/**,plan/**,docs/*.pdf,docs/guide/package.json,.venv/**,*venv*/**,build/**,dist/**,**/__pycache__/**,.pytest_cache/**,.ruff_cache/**,.scannerwork/**,coverage.xml
sonar.python.version=3.10,3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
