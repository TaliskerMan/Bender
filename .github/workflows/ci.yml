# Change Comment (2026-11-15, BEND-9 / BEND-10 & githubactions:S8541/S8544 / CP-ChangeComments):
# Manual-only (`workflow_dispatch`) Linux quality-gate workflow with 40-char
# commit-SHA-pinned GitHub Actions, hash-locked binary wheel dev dependencies
# (`--only-binary :all: --require-hashes -r requirements-dev.txt`), `ruff check`,
# `pytest` + XML coverage, and Bash/ESM syntax checks. Omits `sonarqube-scan-action`
# so SonarQube Cloud Automatic Analysis remains conflict-free.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # Remediated (githubactions:S8541 & githubactions:S8544): Enforce binary wheels
      # only (`--only-binary :all:`) and cryptographic SHA-256 hash verification
      # (`--require-hashes`) against the full transitive lockfile.
      - name: Install hash-locked binary lint & test tools
        run: python -m pip install --disable-pip-version-check --only-binary :all: --require-hashes -r requirements-dev.txt

      - name: Run Ruff static analysis
        run: ruff check src tests

      - name: Run unit test suite with coverage
        run: PYTHONPATH=src pytest --cov=src/bender --cov-report=xml:coverage.xml tests -q

      - name: Validate Linux build script & guide builder syntax
        run: |
          bash -n build_release.sh
          bash -n run.sh
          node --check docs/guide/build_guide.js
