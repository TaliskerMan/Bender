[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bender"
version = "0.1.13"
description = "Linux workstation dashboard — Bite my shiny metal app!"
readme = "README.md"
authors = [
  { name="Chuck Talk", email="chuck@nordheim.online" },
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyGObject",
    # Security-critical: hardened XML parser used by replace_app_grid_icon.py
    # to parse SVG. Guards against XXE and Billion-Laughs DoS (CWE-611).
    "defusedxml",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bender = "bender.main:main"

[tool.ruff.lint]
# Pin the rule set so CI doesn't change meaning when ruff's defaults do.
select = ["E4", "E7", "E9", "F"]
# GTK modules must call gi.require_version() before importing from
# gi.repository, so module-level imports after code are expected.
ignore = ["E402"]
